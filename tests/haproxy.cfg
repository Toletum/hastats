global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:8080

    # Habilitar panel de estadísticas en /stats
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
    stats admin if TRUE

    # Enviar el resto del tráfico al echo-server
    default_backend echo_back

backend echo_back
    server echo1 echo-server:80 check
