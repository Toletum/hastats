services:
  echo-server:
    image: docker.io/ealen/echo-server:0.9.2
    container_name: echo-server
    expose:
      - "80"

  haproxy:
    image: docker.io/library/haproxy:alpine
    container_name: haproxy
    ports:
      - "8080:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,Z
    depends_on:
      - echo-server

  curl-client:
    image: docker.io/curlimages/curl:latest
    container_name: curl-client
    depends_on:
      - haproxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "--- $$(date) ---"
          curl -s http://haproxy:8080 > /dev/null 2>&1
          sleep $SLEEP
        done
    env:
      - name: SLEEP
        value: "5"

  mongodb:
    image: docker.io/library/mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
